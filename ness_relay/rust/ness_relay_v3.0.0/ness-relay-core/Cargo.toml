[package]
name = "ness-relay-core"
version = "0.1.0"
edition = "2021"
authors = ["NETWORK IS COLOMBIA S.A.S."]
description = "Core library for ness-relay: SSH audit, vendor plugins, CIS checks, vulnerability intelligence"
license = "Proprietary"
publish = false

[lib]
name = "ness_relay_core"
path = "src/lib.rs"

[dependencies]
# Re-export from ness-sentinel-core during Phase 1 (bridge migration)
# Phase 2+: replace these with native implementations
ness-sentinel-core = { path = "../../../../ness-sentinel/ness-sentinel-core" }

# Additional deps needed by the bridge and future native code
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
russh = "0.44"
russh-keys = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[lints.rust]
unsafe_code = "deny"
