[package]
name = "ness-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NESS Relay Multi-Vendor Enterprise Network Monitor — binary"
publish = false

[[bin]]
name = "ness-relay"
path = "src/main.rs"
# Phase 2.5.1: eliminamos el binario separado `ness-relay-cred`.
# Toda la lógica de cifrado ahora vive como subcomandos del binario
# principal (`ness-relay credential set|migrate-plaintext|...`), evitando
# distribuir dos binarios y simplificando la experiencia del operador.

[dependencies]
# Workspace-internal
ness-relay-core = { path = "../ness-relay-core" }

# Runtime + serialization
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# CLI
clap = { workspace = true }

# Time / UUID
chrono = { workspace = true }
uuid = { workspace = true }

# HTTP client (rustls only)
reqwest = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Init-once globals
once_cell = { workspace = true }

# Crypto primitives (SNMPv3 USM)
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
des = { workspace = true }
cbc = { workspace = true }
cfb-mode = { workspace = true }
cipher = { workspace = true }
digest = { workspace = true }
rand = { workspace = true }

# ZIP for the update system
zip = { workspace = true }
bytes = { workspace = true }

# Credential encryption (v2.5.0+) — see ness-relay/src/secrets/
aes-gcm = { workspace = true }
hkdf    = { workspace = true }
zeroize = { workspace = true }
subtle  = { workspace = true }
base64  = { workspace = true }
hex     = { workspace = true }
dirs    = { workspace = true }
byteorder = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "deny"
