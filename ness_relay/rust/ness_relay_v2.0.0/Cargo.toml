[package]
name = "ness-relay"
version = "2.0.0"
edition = "2021"
authors = ["NETWORK IS COLOMBIA S.A.S."]
description = "NESS Relay v2.0.0 - Multi-Vendor Enterprise SNMP Monitor (Rust Edition)"
license = "Proprietary"

# ==============================================================================
# PERFIL DE COMPILACIÓN - Binario estático, ultra compacto y rápido
# ==============================================================================
[profile.release]
opt-level = 3           # Optimización máxima
lto = true              # Link-Time Optimization (reduce tamaño y mejora velocidad)
codegen-units = 1       # Un solo CGU para mejor LTO
panic = "abort"         # Abort en panic (reduce tamaño ~10%)
strip = true            # Eliminar símbolos de debug del binario final
overflow-checks = false # Sin checks de overflow en release

# ==============================================================================
# DEPENDENCIAS - 100% Rust puro (sin OpenSSL, sin C)
# ==============================================================================
[dependencies]

maxminddb = "0.24.0"
once_cell = "1.18.0"

# --- Runtime asíncrono ---
tokio = { version = "1", features = ["full"] }

# --- Serialización JSON ---
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# --- HTTP Client (TLS via rustls, 100% Rust, sin OpenSSL) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }

# --- CLI Argument Parsing ---
clap = { version = "4", features = ["derive"] }

# --- Logging estructurado moderno ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# --- Fechas y timestamps ---
chrono = { version = "0.4", features = ["serde"] }

# --- Manejo de errores ---
anyhow    = "1"
thiserror = "1"

# --- Traits async en objetos trait (Box<dyn Trait>) ---
async-trait = "0.1"

# --- Globales inicializados una sola vez (registro de perfiles) ---


# ==============================================================================
# RustCrypto - Primitivas de criptografía 100% Rust
# Para SNMPv3 USM: Autenticación (HMAC-SHA/MD5) + Privacidad (AES/DES)
# ==============================================================================

# Hashes
sha2   = "0.10"    # SHA-256, SHA-384, SHA-512
sha1   = "0.10"    # SHA-1 (legacy SNMPv3 auth)
md-5   = "0.10"    # MD5 (legacy SNMPv3 auth)

# HMAC (autenticación SNMPv3 USM)
hmac = "0.12"

# Cifrado simétrico (privacidad SNMPv3 USM)
aes     = "0.8"    # AES-128 / AES-256
des     = "0.8"    # DES (legacy, compatibilidad)
cbc     = { version = "0.1", features = ["alloc"] }   # DES-CBC
cfb-mode = "0.8"   # AES-CFB128

# Traits de cipher compartidos
cipher = "0.4"
digest = "0.10"

# Generación de bytes aleatorios (IV/salt SNMPv3)
rand = "0.8"

# --- ZIP para sistema de actualización ---
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# --- Utilidades de bytes ---
bytes = "1"

# ==============================================================================
# CONFIGURACIÓN PARA COMPILACIÓN MUSL ESTÁTICA
# ==============================================================================
# Usar esta configuración en .cargo/config.toml:
#   [target.x86_64-unknown-linux-musl]
#   linker = "x86_64-linux-musl-gcc"
#
# Compilar con:
#   RUSTFLAGS="-C target-feature=+crt-static" \
#   cargo build --release --target x86_64-unknown-linux-musl

[[bin]]
name = "ness-relay"
path = "src/main.rs"
